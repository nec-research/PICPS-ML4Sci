includes:
  #- configs/ani-1x/base_1K.yml
  - configs/ani-1x/base.yml

model:
  name: painn
  hidden_channels: 512
  num_layers: 6
  num_rbf: 128
  cutoff: 12.0
  max_neighbors: 50
  scale_file: configs/ani-1x/painn/painn_nb6_scaling_factors.pt
  regress_forces: True
  #direct_forces: True
  use_pbc: True

optim:
  #batch_size: 6 #32
  #eval_batch_size: 3 #32
  load_balancing: atoms
  #eval_every: 5000
  num_workers: 2
  optimizer: AdamW
  optimizer_params: {"amsgrad": True}
  lr_initial: 1.e-4
  lr_gamma: 0.8
  scheduler: ReduceLROnPlateau
  mode: min
  factor: 0.8
  patience: 3
  #max_epochs: 80
  #force_coefficient: 100
  energy_coefficient: 1
  ema_decay: 0.999
  clip_grad_norm: 10
  loss_energy: mae
  loss_force: l2mae
  weight_decay: 0  # 2e-6 (TF weight decay) / 1e-4 (lr) = 2e-2
